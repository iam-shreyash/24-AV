<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24AV - India's Premier Aviation Platform</title>
  <style>
    /* Initial loading screen styles - Matching Home page theme */
    #initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* Match Home hero gradient: from-blue-800 via-blue-900 to-slate-900 */
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 25%, #1e293b 75%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    }

    #initial-loader.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .loader-content {
      text-align: center;
      animation: fadeInUp 0.8s ease-out;
    }

    .loader-logo {
      font-size: 4rem;
      font-weight: 800;
      /* White text to match hero section */
      color: white;
      margin-bottom: 2rem;
      letter-spacing: 0.1em;
      animation: pulse 2s ease-in-out infinite;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
    }

    .loader-plane {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      position: relative;
      animation: fly 3s ease-in-out infinite;
    }

    .loader-plane svg {
      width: 100%;
      height: 100%;
      /* Blue glow matching theme accent colors */
      filter: drop-shadow(0 0 20px rgba(37, 99, 235, 0.6));
    }

    .loader-spinner {
      width: 60px;
      height: 60px;
      margin: 0 auto;
      /* Match blue-600 accent color */
      border: 4px solid rgba(37, 99, 235, 0.15);
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loader-text {
      margin-top: 2rem;
      font-size: 1.125rem;
      /* Match hero text color: text-white/90 */
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
      animation: textPulse 2s ease-in-out infinite;
    }

    .loader-dots {
      display: inline-block;
      width: 20px;
    }

    .loader-dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.85;
        transform: scale(1.02);
      }
    }

    @keyframes textPulse {

      0%,
      100% {
        opacity: 0.9;
      }

      50% {
        opacity: 0.7;
      }
    }

    @keyframes fly {

      0%,
      100% {
        transform: translateX(-10px) translateY(0);
      }

      50% {
        transform: translateX(10px) translateY(-10px);
      }
    }

    @keyframes dots {

      0%,
      20% {
        content: '';
      }

      40% {
        content: '.';
      }

      60% {
        content: '..';
      }

      80%,
      100% {
        content: '...';
      }
    }

    /* Prevent flash of unstyled content */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root {
      min-height: 100vh;
    }
  </style>
</head>

<body>
  <!-- Initial Loading Screen -->
  <div id="initial-loader">
    <div class="loader-content">
      <div class="loader-plane">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M21 16V14L13 9V3.5C13 2.67 12.33 2 11.5 2C10.67 2 10 2.67 10 3.5V9L2 14V16L10 13.5V19L8 20.5V22L11.5 21L15 22V20.5L13 19V13.5L21 16Z"
            fill="white" />
        </svg>
      </div>
      <h1 class="loader-logo">24-AV</h1>
      <div class="loader-spinner"></div>
      <p class="loader-text">
        Preparing your flight experience<span class="loader-dots"></span>
      </p>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
